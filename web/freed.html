<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>FREED</title>
<meta name="description" content="FREED — Talk to someone who knows. A calm, human marketplace to find a verified person who can help you with a decision, skill, career, exam or life." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   FREED — design tokens
   ============================================================ */
:root{
  --pink:#FFAEB3;
  --pink-soft:#FFE1E3;
  --green:#7BC96F;          /* primary action (readable) */
  --green-mid:#B0E1A2;
  --green-light:#CBF5AF;
  --cream:#FAFFD8;
  --bg:#FFFEFA;
  --surface:#FFFFFF;
  --surface-soft:#FFFDF4;
  --ink:#26312B;            /* very dark charcoal (warm) */
  --ink-2:#5E6B62;          /* muted gray-green secondary */
  --ink-3:#8A968D;
  --line:#EFEAE0;           /* extremely subtle warm gray */
  --line-2:#E6E1D6;
  --avail:#3FA34D;
  --danger:#E5686E;
  --shadow-sm:0 1px 2px rgba(38,49,43,.04), 0 2px 8px rgba(38,49,43,.04);
  --shadow:0 6px 24px rgba(38,49,43,.08);
  --shadow-lg:0 18px 48px rgba(38,49,43,.14);
  --r-lg:26px;
  --r-md:18px;
  --r-sm:12px;
  --pill:999px;
  --font-body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-display:'Unbounded',var(--font-body);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(1200px 600px at 15% -10%, #FFF0F1 0%, transparent 55%),
    radial-gradient(1000px 620px at 100% 0%, #EEFBE6 0%, transparent 50%),
    var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
}
/* ---------- device frame ---------- */
#phone{
  position:relative;
  width:100%;
  max-width:430px;
  height:100vh;
  max-height:932px;
  background:var(--bg);
  overflow:hidden;
  display:flex;flex-direction:column;
}
@media(min-width:520px){
  body{padding:26px}
  #phone{
    height:900px;border-radius:40px;
    box-shadow:var(--shadow-lg),0 0 0 10px #1c1c1c,0 0 0 12px #2a2a2a;
  }
}
#app{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
#app::-webkit-scrollbar{width:0}
.screen{min-height:100%;display:flex;flex-direction:column;animation:screenIn .32s cubic-bezier(.2,.7,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:0 20px}
.has-nav{padding-bottom:96px}
.has-cta{padding-bottom:118px}

/* ---------- typography ---------- */
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.d{font-family:var(--font-display)}
.logo{font-family:var(--font-display);font-weight:800;letter-spacing:.02em}
.t-eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.t-h1{font-size:26px;line-height:1.18;font-weight:600}
.t-h2{font-size:20px;line-height:1.25;font-weight:600}
.t-lead{font-size:15px;color:var(--ink-2);line-height:1.5}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
.small{font-size:13px}
.num{font-family:var(--font-display);font-weight:600}

/* ---------- buttons ---------- */
.btn{
  appearance:none;border:0;cursor:pointer;font-family:var(--font-body);
  font-weight:600;font-size:15px;border-radius:var(--pill);
  padding:15px 20px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .12s ease,box-shadow .2s ease,background .2s ease,opacity .2s;
  position:relative;overflow:hidden;line-height:1;color:var(--ink);
}
.btn:active{transform:scale(.972)}
.btn-primary{background:var(--green);color:#0f2a12;box-shadow:0 6px 16px rgba(123,201,111,.35)}
.btn-primary:active{box-shadow:0 3px 10px rgba(123,201,111,.3)}
.btn-pink{background:var(--pink);color:#5a1f24;box-shadow:0 6px 16px rgba(255,174,179,.4)}
.btn-ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn-soft{background:var(--cream);color:var(--ink)}
.btn-dark{background:var(--ink);color:#fff}
.btn-block{width:100%}
.btn-lg{padding:17px 22px;font-size:16px}
.btn:disabled{opacity:.45;pointer-events:none}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.5);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.link{color:var(--ink-2);background:none;border:0;font:inherit;font-weight:600;cursor:pointer;padding:8px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--ink);transition:transform .12s,background .2s}
.iconbtn:active{transform:scale(.9)}

/* ---------- generic surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--line-2);font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink);white-space:nowrap;transition:all .18s;user-select:none}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.green{background:var(--green-light);border-color:transparent}
.chip.green.on{background:var(--green);color:#0f2a12}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:var(--pill)}
.badge-verify{background:#EAF6EC;color:#2f7d3a}
.badge-pink{background:var(--pink-soft);color:#a54952}
.badge-cream{background:var(--cream);color:#6b6a2c}
.badge-gray{background:#F2F0EA;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--avail);box-shadow:0 0 0 0 rgba(63,163,77,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,163,77,.45)}70%{box-shadow:0 0 0 7px rgba(63,163,77,0)}100%{box-shadow:0 0 0 0 rgba(63,163,77,0)}}
.avail-line{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--avail)}
.divider{height:1px;background:var(--line);margin:18px 0}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between}
.wrap{display:flex;flex-wrap:wrap;gap:9px}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:4px 20px 6px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:0 0 auto}
.stars{color:#F2B33D;letter-spacing:1px}
.avatar{border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;color:#fff;flex:0 0 auto;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 76%,rgba(255,254,250,0));padding:14px 20px 10px;display:flex;align-items:center;gap:12px}
.topbar.solid{background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .grow{flex:1;min-width:0}

/* ---------- bottom nav ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
.nav button{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--ink-3);font-size:10.5px;font-weight:600;transition:color .2s}
.nav button.on{color:var(--ink)}
.nav button.on .ic{transform:translateY(-1px)}
.nav .ic{transition:transform .2s}
.nav .cdot{width:4px;height:4px;border-radius:50%;background:var(--green);opacity:0;margin-top:1px}
.nav button.on .cdot{opacity:1}

/* ---------- fixed CTA bar ---------- */
.ctabar{position:absolute;left:0;right:0;bottom:0;z-index:45;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,254,250,0),var(--bg) 32%);display:flex;gap:10px}

/* ---------- search box ---------- */
.searchbox{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line-2);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);cursor:text}
.searchbox input{border:0;outline:0;font:inherit;font-size:15px;flex:1;background:none;color:var(--ink);min-width:0}
.searchbox input::placeholder{color:var(--ink-3)}
.field{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:14px 15px;font:inherit;font-size:15px;color:var(--ink);outline:0;transition:border .2s,box-shadow .2s}
.field:focus{border-color:var(--green-mid);box-shadow:0 0 0 3px rgba(176,225,162,.35)}
textarea.field{resize:none;min-height:96px;line-height:1.5}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 7px 2px}

/* ---------- expert card ---------- */
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .2s}
.ecard:active{transform:scale(.99)}
.ecard-h{display:flex;gap:13px}
.pop{width:250px}
.pop .ecard-h{flex-direction:column}
.usecase{width:210px;border-radius:20px;padding:18px;color:var(--ink);position:relative;overflow:hidden;cursor:pointer;border:1px solid transparent}
.usecase h4{font-size:15.5px;margin-bottom:4px}

/* ---------- bottom sheet ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(30,34,30,.42);opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--shadow-lg);transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.8,.2,1);max-height:88%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:10px auto 4px}
.sheet-body{overflow-y:auto;padding:6px 20px 22px}
.sheet-body::-webkit-scrollbar{display:none}

/* ---------- toast ---------- */
#toasts{position:absolute;left:0;right:0;bottom:104px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 20px}
.toast{background:var(--ink);color:#fff;padding:12px 17px;border-radius:14px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;max-width:100%;animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- skeleton ---------- */
.sk{background:linear-gradient(100deg,#f0ece2 30%,#f8f5ee 50%,#f0ece2 70%);background-size:200% 100%;animation:shim 1.3s infinite;border-radius:12px}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- splash / blobs ---------- */
.blob{position:absolute;border-radius:50%;filter:blur(6px);opacity:.9;mix-blend-mode:multiply;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(14px,-20px) scale(1.06)}66%{transform:translate(-12px,12px) scale(.96)}}
.fade-up{animation:fadeUp 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- progress ---------- */
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.dots{display:flex;gap:7px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2);transition:all .3s}
.dots i.on{width:22px;border-radius:6px;background:var(--ink)}

/* ---------- consultation ---------- */
.callstage{flex:1;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,#2b3a2f,#1a231d);color:#fff}
.callctrl{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:0;color:#fff;cursor:pointer;transition:transform .12s,background .2s}
.callctrl:active{transform:scale(.9)}
.callctrl.off{background:#fff;color:var(--ink)}
.callctrl.end{background:var(--danger)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .cell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink);border:1px solid transparent;position:relative}
.cal .cell.mut{color:var(--ink-3);pointer-events:none;opacity:.4}
.cal .cell.on{background:var(--ink);color:#fff}
.cal .cell.hasslot::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--green)}
.cal .cell.on.hasslot::after{background:#fff}
.cal .hd{text-align:center;font-size:11px;color:var(--ink-3);font-weight:600;padding-bottom:4px}
.slot{padding:12px;border-radius:14px;border:1px solid var(--line-2);text-align:center;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface)}
.slot.on{background:var(--green);border-color:var(--green);color:#0f2a12}

/* ---------- chat ---------- */
.bubble{max-width:78%;padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;box-shadow:var(--shadow-sm)}
.bubble.me{background:var(--green);color:#0f2a12;border-bottom-right-radius:5px;align-self:flex-end}
.bubble.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.composer{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;gap:9px;align-items:flex-end;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}

/* utils */
.center{text-align:center}
.stack>*+*{margin-top:14px}
.stack-sm>*+*{margin-top:9px}
.grow{flex:1}
.nowrap{white-space:nowrap}
.hide{display:none!important}
svg{display:block}
.checkline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.checkline:last-child{border-bottom:0}
.tick{width:24px;height:24px;border-radius:50%;background:#EAF6EC;display:grid;place-items:center;flex:0 0 auto}
.statline{display:flex;flex-direction:column;gap:2px}
.disc{background:var(--pink-soft);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;color:#8a4b52}
.seg{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--pill);padding:4px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:var(--pill);font:inherit;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;transition:.2s}
.seg button.on{background:var(--ink);color:#fff}
.toggle{width:48px;height:28px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .25s;flex:0 0 auto}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform .25s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
</style>
</head>
<body>
<div id="phone">
  <div id="app"></div>
  <div id="nav-slot"></div>
  <div id="toasts"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div class="sheet-body" id="sheet-body"></div></div>
</div>

<script>

   FREED — single-file interactive prototype

   ========================================================================== */
(function(){
"use strict";

const rupee=n=>"₹"+Number(n).toLocaleString("en-IN");

/* ---------- SVG line icons ---------- */
const I={

  search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',

  doc:'<path d="M6.5 3.5h7l4 4V20a.5.5 0 0 1-.5.5H6.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5Z"/><path d="M13 3.5V8h4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  chevr:'<path d="m9 5 7 7-7 7"/>',
  send:'<path d="M4.5 12 20 5l-4.5 15-4-6.5-6.5-1.5Z"/>',
  filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
  heart:'<path d="M12 20s-7-4.3-7-9.3A3.7 3.7 0 0 1 12 8a3.7 3.7 0 0 1 7 2.7c0 5-7 9.3-7 9.3Z"/>',
  cash:'<rect x="3.5" y="6.5" width="17" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/>',
  logout:'<path d="M14 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8M16 8l4 4-4 4M20 12H9"/>',
  briefcase:'<rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/>',
  sliders:'<path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="15" cy="8" r="2"/><circle cx="8" cy="16" r="2"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
  flame:'<path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-1.5.6-2.6 1.2-3.3.4 1 1.3 1.3 1.3 1.3S9 8 12 3Z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',

function go(screen,opts={}){
  if(!opts.replace && state.screen && state.screen!==screen) state.history.push(state.screen);
  state.screen=screen;
  if(NAV_SCREENS[screen]) state.tab=screen;
  render();
  const a=$("#app"); if(a) a.scrollTop=0;
}
function back(){
  const p=state.history.pop();

}

}

/* ----- AI MATCHING ----- */
const MATCH_Q=[
  {k:"who",q:"What best describes you?",opts:["Student","Early career","Working professional","Founder","Parent","Other"]},
  {k:"help",q:"What kind of help do you want?",opts:["A decision","A plan","A skill","Feedback","Mentorship","Emotional support","Other"]},
  {k:"when",q:"When do you want to talk?",opts:["Right now","Today","This week","I'm flexible"]},
];
function matchStepIndex(){for(let i=0;i<MATCH_Q.length;i++){if(!state.matchAns[MATCH_Q[i].k])return i;}return MATCH_Q.length;}
function matchResults(){
  // naive relevance from query keywords + answers
  const q=(state.query||"").toLowerCase();
  const map=[["product","tech"],["pm","tech"],["gate",  "exams"],["upsc","exams"],["cat","exams"],["exam","exams"],["resume","career"],["interview","career"],["career","career"],["job","career"],["psycholog","wellbeing"],["stress","wellbeing"],["anxiety","wellbeing"],["mental","wellbeing"],["business","business"],["startup","business"],["badminton","sports"],["coach","sports"],["cfa","finance"],["invest","finance"],["money","finance"],["design","design"],["study","education"],["abroad","education"],["confidence","growth"],["habit","growth"],["english","languages"],["ielts","languages"],["parent","parenting"]];
  let cat=null; for(const[kw,c]of map){if(q.includes(kw)){cat=c;break;}}
  let pool=cat?EXPERTS.filter(e=>e.cat===cat):EXPERTS;
  if(state.matchAns.when==="Right now"){const live=pool.filter(e=>e.avail); if(live.length)pool=live;}
  pool=[...pool].sort((a,b)=>(b.avail-a.avail)||(b.rating-a.rating));
  return pool.slice(0,5);
}

function sortExperts(list,sort){
  const l=[...list];
  if(sort==="availability")l.sort((a,b)=>b.avail-a.avail||b.rating-a.rating);
  else if(sort==="experience")l.sort((a,b)=>b.yrs-a.yrs);
  else if(sort==="price")l.sort((a,b)=>a.rate-b.rate);
  else if(sort==="rating")l.sort((a,b)=>b.rating-a.rating);
  else l.sort((a,b)=>b.avail-a.avail||b.rating-a.rating||b.consults-a.consults);
  return l;
}

function daysGrid(){
  const today=new Date(2026,8,16); // Sep 16 2026
  const first=new Date(2026,8,1); const startDow=first.getDay();
  const cells=[]; for(let i=0;i<startDow;i++)cells.push(null);
  for(let d=1;d<=30;d++)cells.push(d);
  return {cells,today:16};
}

function startFinding(then){

  setTimeout(then,1500);
}
function startMode(expertId,mode){
  state.expertId=expertId; state.consult={expertId,mode};
  closeSheet(); go("preconnect");
}
function beginConsult(expertId){
  const e=byId(expertId);
  state.consult={expertId,mode:state.consult?.mode||"audio",elapsed:0,muted:false,spk:false,camOff:false};
  go("accepting");
  setTimeout(()=>{go("active");startTimer();},1800);
}
let timer=null;
function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{
    if(state.screen!=="active"){clearInterval(timer);return;}
    state.consult.elapsed++;
    // light DOM update to avoid full re-render each second
    const c=state.consult,e=byId(c.expertId);
    const mm=String(Math.floor(c.elapsed/60)).padStart(2,"0"),ss=String(c.elapsed%60).padStart(2,"0");
    const cost=Math.max(1,Math.ceil(c.elapsed/60))*e.rate;
    const tEl=app.querySelector(".callstage b");const cEl=app.querySelector('.callstage [style*="spent"]');
    if(tEl)tEl.textContent=`${mm}:${ss}`; if(cEl)cEl.textContent=`${rupee(cost)} spent`;
  },1000);
}
function endConsult(){
  clearInterval(timer);
  const c=state.consult,e=byId(c.expertId);
  const cost=Math.max(1,Math.ceil((c.elapsed||60)/60))*e.rate;
  state.reviewExpertId=c.expertId; state.review=null;
  // add to past bookings
  state.bookings.unshift({id:"c"+Date.now(),expertId:c.expertId,date:"Today",time:"Just now",dur:(Math.max(1,Math.ceil((c.elapsed||60)/60)))+" min",amount:cost,status:"past",mode:c.mode,rated:false});
  go("postreview");
}
function confirmBooking(){
  const b=state.booking,e=byId(b.expertId);
  state.payCtx={title:`${b.dur} session`,sub:`${b.date} · ${b.time}`,amount:b.amount,kind:"booking",expertId:e.id};
  state.pendingBooking={expertId:e.id,date:b.date,time:b.time,dur:b.dur,amount:b.amount};
  go("payment");
}

/* ==========================================================================
   EVENT DELEGATION
   ========================================================================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-back],[data-go],[data-onb-next],[data-onb-skip],[data-login],[data-do-login],[data-open-search],[data-sugg],[data-find],[data-match],[data-cat],[data-need],[data-fil],[data-filters],[data-sortopen],[data-sort],[data-apply-filters],[data-expert],[data-talk],[data-talk-now],[data-book],[data-service],[data-startmode],[data-accept],[data-cc],[data-endcall],[data-day],[data-slot],[data-dur],[data-confirm-booking],[data-paymethod],[data-pay],[data-open-chat],[data-send],[data-star],[data-useful],[data-rtag],[data-again],[data-submit-review],[data-bktab],[data-join],[data-reschedule],[data-cancel],[data-doconcancel],[data-summary],[data-rate],[data-become-expert],[data-exp-next],[data-exp-back],[data-avail-toggle],[data-emode],[data-adminsec],[data-adminrev],[data-adminaction],[data-report],[data-dosreport],[data-doblock],[data-edit-profile],[data-pfrole],[data-save-profile],[data-logout],[data-toast],[data-noop],[data-close-sheet],[data-become]");
  if(!t)return;
  const d=t.dataset;

  if("back" in d)return back();
  if(d.go)return go(d.go);
  if("toast" in d){toast(d.toast);return;}
  if("noop" in d){t.classList.toggle("on");return;}
  if("closeSheet" in d)return closeSheet();

  /* onboarding */
  if("onbNext" in d){if(state.onbStep<2){state.onbStep++;render();}else{go("login");}return;}
  if("onbSkip" in d)return go("login");

  /* login */
  if(d.login){
    if(d.login==="Google"||d.login==="Apple"){state.user.name="Alex";toast("Signed in with "+d.login);go("home",{replace:true});}
    else openSheet(loginSheet(d.login));
    return;
  }
  if("doLogin" in d){const v=$("#login-input")?.value?.trim();closeSheet();if(v)state.user.name="Alex";toast("Welcome to FREED");go("home",{replace:true});return;}

  /* search */
  if("openSearch" in d)return go("search");
  if(d.sugg){state.query=d.sugg;go("search");setTimeout(()=>{const p=$("#prob");if(p)p.value=d.sugg;},30);return;}
  if("find" in d){state.query=$("#prob")?.value?.trim()||state.query;state.matchAns={};startFinding(()=>go("matching"));return;}
  if(d.match){const[k,v]=d.match.split("|");state.matchAns[k]=v;if(matchStepIndex()>=MATCH_Q.length){startFinding(()=>go("matching"));}else{render();}return;}

  /* categories / explore */
  if(d.cat){if(d.cat==="__more"){go("explore");return;}state.explore.cat=d.cat;go("explore");return;}
  if(d.need){toast('Showing people for "'+d.need+'"');return;}
  if("filters" in d)return openSheet(filtersSheet());
  if("sortopen" in d)return openSheet(sortSheet());
  if(d.fil){state.explore.filters[d.fil]=!state.explore.filters[d.fil];render();if($("#sheet").classList.contains("show"))openSheet(filtersSheet());return;}
  if(d.sort){state.explore.sort=d.sort;closeSheet();render();return;}
  if("applyFilters" in d){closeSheet();render();return;}

  /* expert */
  if(d.expert){state.expertId=+d.expert;go("profile_expert");return;}
  if(d.talk){const ex=byId(+d.talk);if(!ex.avail){toast(ex.name.split(" ")[0]+" isn't live now — book a time");state.expertId=+d.talk;go("booking");return;}state.expertId=+d.talk;openSheet(serviceSheet(+d.talk));return;}
  if("talkNow" in d){startFinding(()=>{state.explore.cat=null;const live=EXPERTS.filter(x=>x.avail).sort((a,b)=>b.rating-a.rating).slice(0,5);state.liveMatches=live;openLiveSheet();});return;}
  if(d.book){state.expertId=+d.book;state.booking={expertId:+d.book};closeSheet();go("booking");return;}
  if(d.service){const[id,ref]=d.service.split("|");const ex=byId(+id);const m=serviceMeta(ref);const s=ex.services.find(x=>x.ref===ref);
    if(m.per){startMode(+id,ref==="chat"?"chat":ref==="video"?"video":"audio");}
    else{state.payCtx={title:m.t,amount:s.price,kind:"service",expertId:+id};state.pendingBooking=s.dur?{expertId:+id,date:"To be scheduled",time:"—",dur:s.dur,amount:s.price}:{expertId:+id,amount:s.price};go("payment");}
    return;}
  if(d.startmode){const[id,mode]=d.startmode.split("|");startMode(+id,mode);return;}
  if(d.accept){beginConsult(+d.accept);return;}

  /* call controls */
  if(d.cc){const c=state.consult;if(d.cc==="mute")c.muted=!c.muted;if(d.cc==="spk")c.spk=!c.spk;if(d.cc==="cam")c.camOff=!c.camOff;if(d.cc==="chatdoc"){toast("Share a document — demo");return;}render();return;}
  if("endcall" in d)return endConsult();

  /* booking */
  if(d.day){const b=state.booking;b.date=dLabel(+d.day);b.time=null;b.dur=null;render();return;}
  if(d.slot){state.booking.time=d.slot;render();return;}
  if(d.dur){const[l,p]=d.dur.split("|");state.booking.dur=l;state.booking.amount=+p;render();return;}
  if("confirmBooking" in d)return confirmBooking();

  /* payment */
  if(d.paymethod){app.querySelectorAll("[data-paymethod]").forEach(el=>{el.style.borderColor="var(--line)";const dot=el.querySelector('div[style*="border-radius:50%"]');});toast(({upi:"UPI",card:"Card",nb:"Net banking",wallet:"Wallet"})[d.paymethod]+" selected");return;}
  if("pay" in d){go("paying");setTimeout(()=>{
      const pb=state.pendingBooking;const kind=state.payCtx.kind;
      if(kind==="booking"||( state.payCtx.sub)){ if(pb&&pb.date&&pb.date!=="To be scheduled"){state.bookings.unshift({id:"b"+Date.now(),expertId:pb.expertId,date:pb.date,time:pb.time,dur:pb.dur,amount:pb.amount,status:"upcoming",mode:state.consult?.mode||"video"});}}
      state.lastBooking=Object.assign({kind:pb&&pb.date&&pb.date!=="To be scheduled"?"booking":"service"},pb);
      go("confirmed",{replace:true});
    },1600);return;}

  /* chat */
  if(d.openChat){state.expertId=+d.openChat;state.chatMsgs=null;go("chat");return;}
  if("send" in d){const inp=$("#msg");const v=inp?.value?.trim();if(!v)return;state.chatMsgs.push({me:true,t:v});render();setTimeout(()=>{const e=byId(state.expertId);state.chatMsgs.push({me:false,t:"Got it — thanks for sharing. Let's dig into that."});render();},900);return;}

  /* review */
  if(d.star){(state.review=state.review||{stars:0,useful:null,again:null,tags:[]}).stars=+d.star;render();return;}
  if(d.useful){state.review.useful=d.useful;render();return;}
  if(d.rtag){const arr=state.review.tags;const i=arr.indexOf(d.rtag);i>=0?arr.splice(i,1):arr.push(d.rtag);render();return;}
  if(d.again){state.review.again=d.again;render();return;}
  if("submitReview" in d){const b=state.bookings.find(x=>x.expertId===(state.reviewExpertId)&&x.status==="past");if(b)b.rated=true;toast("Thanks for your feedback");go("summary",{replace:true});return;}

  /* bookings */
  if(d.bktab){state.bkTab=d.bktab;render();return;}
  if(d.join){const b=state.bookings.find(x=>x.id===d.join);state.expertId=b.expertId;state.consult={expertId:b.expertId,mode:b.mode};beginConsult(b.expertId);return;}
  if(d.reschedule){const b=state.bookings.find(x=>x.id===d.reschedule);state.expertId=b.expertId;state.booking={expertId:b.expertId};toast("Pick a new time");go("booking");return;}
  if(d.cancel){const b=state.bookings.find(x=>x.id===d.cancel);openSheet(`<h3 class="t-h2" style="margin:6px 0 6px">Cancel this session?</h3><p class="small muted" style="margin-bottom:16px">You'll get a full refund to your original payment method.</p><button class="btn btn-pink btn-block btn-lg" data-doconcancel="${b.id}">Yes, cancel & refund</button><button class="btn btn-soft btn-block" style="margin-top:9px" data-close-sheet>Keep it</button>`);return;}
  if(d.doconcancel){const b=state.bookings.find(x=>x.id===d.doconcancel);if(b)b.status="cancelled";closeSheet();toast("Cancelled — refund on the way");render();return;}
  if(d.summary){state.reviewExpertId=+d.summary;go("summary");return;}
  if(d.rate){state.reviewExpertId=+d.rate;state.review=null;go("postreview");return;}

  /* expert mode */
  if("becomeExpert" in d||"become" in d){state.expOnbStep=0;go("expertonboard");return;}
  if("expNext" in d){if(state.expOnbStep<EXP_STEPS.length-1){state.expOnbStep++;render();}else{state.isExpert=true;toast("Submitted for verification 🎉");go("expertdash",{replace:true});}return;}
  if("expBack" in d){if(state.expOnbStep>0){state.expOnbStep--;render();}else{go("profile");}return;}
  if("availToggle" in d){state.expertAvailable=!state.expertAvailable;render();if(state.expertAvailable)toast("You're visible for instant consultations");return;}
  if(d.emode){const i=state.expertModes.indexOf(d.emode);i>=0?state.expertModes.splice(i,1):state.expertModes.push(d.emode);render();return;}

  /* admin */
  if(d.adminsec){state.adminSec=d.adminsec;render();return;}
  if(d.adminrev!==undefined&&"adminrev" in d){const a=ADMIN_QUEUE[+d.adminrev];openSheet(adminReviewSheet(a));return;}
  if(d.adminaction){toast(d.adminaction);closeSheet();return;}

  /* report / safety */
  if(d.report!==undefined&&"report" in d)return openSheet(reportSheet(d.report));
  if("dosreport" in d){closeSheet();toast("Report sent — our team will review");return;}
  if("doblock" in d){closeSheet();toast("Blocked — you won't be matched again");return;}

  /* profile */
  if("editProfile" in d)return openSheet(editProfileSheet());
  if(d.pfrole){state.user.role=d.pfrole;openSheet(editProfileSheet());return;}
  if("saveProfile" in d){const n=$("#pf-name")?.value?.trim();if(n)state.user.name=n;closeSheet();toast("Profile updated");render();return;}
  if("logout" in d){state.history=[];state.screen="splash";go("login",{replace:true});toast("Logged out");return;}
});
function openLiveSheet(){
  const live=state.liveMatches||[];
  openSheet(`<h3 class="t-h2" style="margin:6px 0 4px">${live.length} experts are available</h3>
    <p class="small muted" style="margin-bottom:14px">People who can talk to you right now.</p>
    <div class="stack-sm">${live.map(e=>`
      <button class="card between" data-talk="${e.id}" style="padding:12px;width:100%;text-align:left;cursor:pointer">
        <div class="row">${avatarEl(e,42)}<div><b class="small">${esc(e.name)}</b><div class="tiny muted">${esc(e.role)} · ${rupee(e.rate)}/min</div></div></div>
        <span class="avail-line"><span class="dot"></span></span>
      </button>`).join("")}</div>`);
}
function adminReviewSheet(a){
  return `<h3 class="t-h2" style="margin:6px 0 4px">${esc(a.name)}</h3><p class="small muted" style="margin-bottom:14px">${esc(a.role)}</p>
    <div class="card" style="padding:6px 16px;margin-bottom:14px">
      ${[["Government ID","Uploaded"],["Qualification","Uploaded"],["Experience proof","Uploaded"],[a.kind==='licensed'?"Professional registration":"References",a.kind==='licensed'?"RCI No. verifying…":"Provided"]].map(([l,v])=>`<div class="checkline">${ic("doc",16)}<span class="small grow">${l}</span><span class="tiny muted">${v}</span></div>`).join("")}
    </div>
    ${a.kind==='licensed'?`<div class="disc" style="margin-bottom:14px">${ic("shield",13)} Regulated profession — verify registration before approving.</div>`:''}
    <div class="wrap" style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
      <button class="btn btn-primary" data-adminaction="Approved & verified">Approve</button>
      <button class="btn btn-ghost" data-adminaction="Marked: needs info">Request info</button>
      <button class="btn btn-ghost" data-adminaction="Rejected">Reject</button>
      <button class="btn btn-ghost" data-adminaction="Suspended">Suspend</button>
    </div>`;
}
$("#scrim").addEventListener("click",closeSheet);

/* ripple micro-interaction */
function bindRipples(){
  app.querySelectorAll(".btn").forEach(b=>{
    if(b._rip)return;b._rip=1;
    b.addEventListener("click",ev=>{
      const r=b.getBoundingClientRect();const s=Math.max(r.width,r.height);
      const el=document.createElement("span");el.className="ripple";el.style.width=el.style.height=s+"px";
      el.style.left=(ev.clientX-r.left-s/2)+"px";el.style.top=(ev.clientY-r.top-s/2)+"px";
      b.appendChild(el);setTimeout(()=>el.remove(),600);
    });
  });
}

/* ==========================================================================
   BOOT
   ========================================================================== */
function boot(){
  render();
  setTimeout(()=>{if(state.screen==="splash"){state.onbStep=0;go("onboarding",{replace:true});}},2200);
}
boot();
})();
</script>
